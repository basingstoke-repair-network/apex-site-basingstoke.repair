backend:
  name: git-gateway
  branch: live

# Uncomment the following lines if you want to use GitHub OAuth for authentication
publish_mode: editorial_workflow # Recommended for multi-user or review process
media_folder: "public/uploads" # Media files will be stored in public/uploads
public_folder: "/uploads" # The public path for media files

collections:
  - name: "pages"
    label: "Pages"
    files:
      - file: "src/content/pages/introduction.md"
        label: "Introduction"
        name: "introduction"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Body", name: "body", widget: "spdx-markdown"}
  - name: "Herald"
    label: "Herald"
    folder: "src/content/herald"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Featured Image", name: "image", widget: "image", required: false}
      - {label: "Body", name: "body", widget: "spdx-markdown"}
  - name: "FAQ"
    label: "FAQ"
    folder: "src/content/faq"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Order", name: "order", widget: "number"}
      - {label: "Body", name: "body", widget: "spdx-markdown"}
  - name: "settings"
    label: "Settings"
    files:
      - file: "src/content/settings/countdown.md"
        label: "Countdown Settings"
        name: "countdown"
        fields:
          - label: "Chineham Repair Cafe"
            name: "chineham"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string", default: "Chineham Repair Cafe"}
              - {label: "Event Time", name: "eventTime", widget: "string", default: "10:00", hint: "Time in HH:MM format"}
              - {label: "Event Duration (hours)", name: "eventDuration", widget: "number", default: 3}
              - {label: "Skip December", name: "skipDecember", widget: "boolean", default: true}
              - {label: "Before Event Text", name: "beforeEventText", widget: "string", default: "Next Chineham RC opens in:"}
              - {label: "During Event Text", name: "duringEventText", widget: "string", default: "Chineham RC closes in:"}
          - label: "Hatch Warren Repair Cafe"
            name: "hatchWarren"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string", default: "Hatch Warren Repair Cafe"}
              - {label: "Event Time", name: "eventTime", widget: "string", default: "10:00", hint: "Time in HH:MM format"}
              - {label: "Event Duration (hours)", name: "eventDuration", widget: "number", default: 3}
              - {label: "Skip December", name: "skipDecember", widget: "boolean", default: true}
              - {label: "Before Event Text", name: "beforeEventText", widget: "string", default: "Next Hatch Warren RC opens in:"}
              - {label: "During Event Text", name: "duringEventText", widget: "string", default: "Hatch Warren RC closes in:"}
