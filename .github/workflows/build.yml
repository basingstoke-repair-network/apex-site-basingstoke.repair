name: Build site

on:
  push:
  pull_request:
    branches: ['staging', 'live']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build the website

    steps:
      - uses: actions/checkout@v6
      - name: Install, build, and upload your site
        run: |
          npm install --legacy-peer-deps
          npm run build
