name: Build site

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  deployments: write

concurrency:
  group: 'pages-${{ github.ref }}'
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    name: Build the website
    outputs:
      deploy-url: ${{ steps.netlify-deploy.outputs.deploy-url }}
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
      # Dependabot-triggered runs (and any other same-repo run) use a
      # restricted secret store; when it's not configured there, the
      # deploy step below silently no-ops instead of failing, which
      # masks a broken preview/production deploy behind a green check.
      # Fork PRs legitimately never get secrets, so only enforce this
      # for runs against this repo.
      - name: Verify deploy credentials are configured
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [[ -z "$NETLIFY_AUTH_TOKEN" || -z "$NETLIFY_SITE_ID" ]]; then
            echo "::error::Netlify deploy credentials are missing for this run (actor: ${{ github.actor }}, event: ${{ github.event_name }}). If this was triggered by Dependabot, add NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID under Settings > Secrets and variables > Dependabot."
            exit 1
          fi
      - uses: nwtgck/actions-netlify@v4.0.0
        id: netlify-deploy
        with:
          publish-dir: './dist'
          production-branch: live
          production-deploy: ${{ github.ref == 'refs/heads/live' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions"
          enable-pull-request-comment: true
          enable-commit-comment: false
          enable-commit-status: false
          enable-github-deployment: false
          overwrites-pull-request-comment: true
          github-deployment-environment: ${{ github.ref == 'refs/heads/live' && 'production' || github.event.number != null && format('pr-{0}', github.event.number) || format('branch-{0}', github.ref_name) }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  lighthouse-audit:
    runs-on: ubuntu-latest
    name: Lighthouse accessibility & QA audit
    needs: build-deploy
    if: needs.build-deploy.outputs.deploy-url != ''
    steps:
      - uses: actions/checkout@v7
      - uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ needs.build-deploy.outputs.deploy-url }}
          configPath: './lighthouserc.json'
          # GitHub artifact upload is handled by the dedicated step below
          # (so we can set a long retention period); this action's own
          # uploadArtifacts only supports the default org/repo setting.
          uploadArtifacts: false
          # LHCI has no persistent-GCS upload target — temporaryPublicStorage
          # is Google's own managed Cloud Storage, the only GCS-backed option
          # LHCI exposes.
          temporaryPublicStorage: true

      # Long-term copy: LHCI's temporary-public-storage reports expire after
      # a few weeks, so also keep the full HTML/JSON reports as a GitHub
      # Actions artifact for 90 days (the max retention on the free plan).
      - name: Upload Lighthouse report as a build artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-results
          path: .lighthouseci
          retention-days: 90
