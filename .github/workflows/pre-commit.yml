name: Pre-commit checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    name: Run pre-commit hooks
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - uses: j178/prek-action@v3.0.0
        with:
          extra-args: --all-files --stage pre-commit

      - name: Enforce Conventional Commits on each commit in range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            commits="$HEAD_SHA"
          else
            commits=$(git rev-list "$BASE_SHA..$HEAD_SHA")
          fi

          for sha in $commits; do
            echo "Checking commit $sha"
            git log -1 --format=%B "$sha" > /tmp/commit-msg.txt
            prek run --stage commit-msg --commit-msg-filename /tmp/commit-msg.txt
          done
