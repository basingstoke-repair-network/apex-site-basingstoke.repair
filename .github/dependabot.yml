version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: "Europe/London"
    commit-message:
      prefix: "chore(ci-deps)"
    reviewers:
      - "shymega"
      - "rdownes"
    groups:
      gh-actions-deps:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: "Europe/London"
    commit-message:
      prefix: "chore(deps)"
    reviewers:
      - "shymega"
      - "rdownes"
    groups:
      npm-deps:
        patterns:
          - "*"
    ignore:
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
